<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(ellipse at 50% 40%, #16213a, #06070c 75%); color: #efe9db; font-family: system-ui, "Segoe UI", Arial, sans-serif; }
  main { text-align: center; padding: 24px 16px; max-width: 560px; }
  .n { font-size: 96px; line-height: 1; color: #d4a84b; font-weight: 700; letter-spacing: .02em; }
  h1 { font-weight: 300; font-size: 28px; margin: 8px 0 4px; }
  p { color: #b9b2a2; margin: 0 0 28px; font-size: 14px; }
  a { display: block; margin: 10px auto; max-width: 320px; padding: 14px 18px; border-radius: 10px; text-decoration: none; font-size: 18px; }
  .go { background: #d4a84b; color: #14110a; font-weight: 700; }
  .alt { border: 1px solid #3a3f52; color: #efe9db; }
  small { display: block; margin-top: 22px; color: #8a8576; font-size: 12px; line-height: 1.6; }
</style>
</head>
<body>
<main>
  <div class="n">80</div>
  <h1>{{TITLE}}</h1>
  <p>{{SUMMARY}}</p>
  <a class="go" href="/show/">הפעלת המצגת</a>
  <a class="alt" href="/presenter/" target="sy80-presenter">חלון המציג (למסך הלפטופ)</a>
  <small>יוצא ב־{{DATE}}. כל התמונות, הסרטונים והמוזיקה נמצאים בתיקייה הזו.<br>F מסך מלא · רווח או חצים מעבר בין שקופיות · P השהיה · M השתקה · B מסך שחור</small>
</main>
</body>
</html>
